<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pong Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Arial', sans-serif;
        }

        .container {
            text-align: center;
            background: rgba(0, 0, 0, 0.8);
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #00ff00;
            margin-bottom: 20px;
            font-size: 2.5em;
            text-shadow: 0 0 10px #00ff00;
        }

        .scoreboard {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            gap: 40px;
        }

        .score {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .label {
            color: #aaa;
            font-size: 0.9em;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .score-value {
            color: #00ff00;
            font-size: 2em;
            font-weight: bold;
            text-shadow: 0 0 10px #00ff00;
        }

        #pongCanvas {
            display: block;
            background: #000;
            border: 3px solid #00ff00;
            margin: 20px auto;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.5);
            cursor: none;
        }

        .instructions {
            color: #ccc;
            font-size: 0.9em;
            margin-top: 20px;
            line-height: 1.6;
        }

        .instructions p {
            margin: 5px 0;
        }

        .instructions strong {
            color: #00ff00;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>PONG GAME</h1>
        <div class="scoreboard">
            <div class="score">
                <span class="label">Player</span>
                <span class="score-value" id="playerScore">0</span>
            </div>
            <div class="score">
                <span class="label">Computer</span>
                <span class="score-value" id="computerScore">0</span>
            </div>
        </div>
        
        <canvas id="pongCanvas" width="800" height="400"></canvas>
        
        <div class="instructions">
            <p><strong>Controls:</strong></p>
            <p>🖱️ Move mouse up/down to control left paddle</p>
            <p>⬆️ ⬇️ Arrow keys also work</p>
            <p>Computer controls right paddle</p>
            <p>First to 5 points wins!</p>
        </div>
    </div>
    
    <script>
        // Canvas setup
        const canvas = document.getElementById('pongCanvas');
        const ctx = canvas.getContext('2d');

        // Game objects
        const paddleWidth = 10;
        const paddleHeight = 80;
        const ballSize = 8;

        const player = {
            x: 10,
            y: canvas.height / 2 - paddleHeight / 2,
            width: paddleWidth,
            height: paddleHeight,
            dy: 0,
            speed: 6
        };

        const computer = {
            x: canvas.width - paddleWidth - 10,
            y: canvas.height / 2 - paddleHeight / 2,
            width: paddleWidth,
            height: paddleHeight,
            dy: 0,
            speed: 5
        };

        const ball = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            dx: 5,
            dy: 5,
            radius: ballSize,
            speed: 5
        };

        let playerScore = 0;
        let computerScore = 0;
        const winScore = 5;

        // Input handling
        const keys = {};
        let mouseY = canvas.height / 2;

        document.addEventListener('keydown', (e) => {
            keys[e.key] = true;
        });

        document.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });

        document.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            mouseY = e.clientY - rect.top;
        });

        // Update player paddle position
        function updatePlayer() {
            // Mouse control
            const targetY = mouseY - player.height / 2;
            player.y += (targetY - player.y) * 0.15;

            // Arrow key control
            if (keys['ArrowUp']) {
                player.y = Math.max(0, player.y - player.speed);
            }
            if (keys['ArrowDown']) {
                player.y = Math.min(canvas.height - player.height, player.y + player.speed);
            }

            player.y = Math.max(0, Math.min(canvas.height - player.height, player.y));
        }

        // Update computer paddle position (AI)
        function updateComputer() {
            const computerCenter = computer.y + computer.height / 2;
            const ballCenter = ball.y;

            if (computerCenter < ballCenter - 35) {
                computer.y = Math.min(canvas.height - computer.height, computer.y + computer.speed);
            } else if (computerCenter > ballCenter + 35) {
                computer.y = Math.max(0, computer.y - computer.speed);
            }

            computer.y = Math.max(0, Math.min(canvas.height - computer.height, computer.y));
        }

        // Update ball position
        function updateBall() {
            ball.x += ball.dx;
            ball.y += ball.dy;

            // Wall collision (top and bottom)
            if (ball.y - ball.radius <= 0 || ball.y + ball.radius >= canvas.height) {
                ball.dy *= -1;
                ball.y = Math.max(ball.radius, Math.min(canvas.height - ball.radius, ball.y));
            }

            // Paddle collision (player)
            if (
                ball.x - ball.radius <= player.x + player.width &&
                ball.y >= player.y &&
                ball.y <= player.y + player.height
            ) {
                ball.dx *= -1;
                ball.x = player.x + player.width + ball.radius;

                const deltaY = ball.y - (player.y + player.height / 2);
                ball.dy += deltaY * 0.1;
            }

            // Paddle collision (computer)
            if (
                ball.x + ball.radius >= computer.x &&
                ball.y >= computer.y &&
                ball.y <= computer.y + computer.height
            ) {
                ball.dx *= -1;
                ball.x = computer.x - ball.radius;

                const deltaY = ball.y - (computer.y + computer.height / 2);
                ball.dy += deltaY * 0.1;
            }

            // Score points
            if (ball.x < 0) {
                computerScore++;
                document.getElementById('computerScore').textContent = computerScore;
                resetBall();
            } else if (ball.x > canvas.width) {
                playerScore++;
                document.getElementById('playerScore').textContent = playerScore;
                resetBall();
            }
        }

        // Reset ball to center
        function resetBall() {
            ball.x = canvas.width / 2;
            ball.y = canvas.height / 2;
            ball.dx = (Math.random() > 0.5 ? 1 : -1) * ball.speed;
            ball.dy = (Math.random() - 0.5) * ball.speed;
        }

        // Draw functions
        function drawPaddle(paddle) {
            ctx.fillStyle = '#00ff00';
            ctx.fillRect(paddle.x, paddle.y, paddle.width, paddle.height);
            ctx.strokeStyle = '#00ff00';
            ctx.lineWidth = 2;
            ctx.strokeRect(paddle.x, paddle.y, paddle.width, paddle.height);
        }

        function drawBall() {
            ctx.fillStyle = '#ff00ff';
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#ff00ff';
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        function drawCenter() {
            ctx.strokeStyle = '#00ff00';
            ctx.setLineDash([10, 10]);
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2, 0);
            ctx.lineTo(canvas.width / 2, canvas.height);
            ctx.stroke();
            ctx.setLineDash([]);
        }

        function drawGameOver() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#00ff00';
            ctx.font = 'bold 40px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 40);

            ctx.font = '24px Arial';
            const winner = playerScore > computerScore ? 'YOU WIN!' : 'COMPUTER WINS!';
            ctx.fillText(winner, canvas.width / 2, canvas.height / 2 + 20);

            ctx.font = '18px Arial';
            ctx.fillText('Refresh page to play again', canvas.width / 2, canvas.height / 2 + 60);
        }

        // Main game loop
        function gameLoop() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (playerScore >= winScore || computerScore >= winScore) {
                drawCenter();
                drawPaddle(player);
                drawPaddle(computer);
                drawBall();
                drawGameOver();
                return;
            }

            updatePlayer();
            updateComputer();
            updateBall();

            drawCenter();
            drawPaddle(player);
            drawPaddle(computer);
            drawBall();

            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
